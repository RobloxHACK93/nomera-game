name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir www
          cp index.html manifest.webmanifest sw.js www/
          cp -r icons www/

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Номера" com.nomera.game --web-dir www
          npx cap add android
          npx cap sync android

      - name: Set app icon
        run: |
          for d in android/app/src/main/res/mipmap-*; do
            case "$d" in
              *anydpi*) rm -rf "$d" ;;
              *)
                cp www/icons/icon-192.png "$d/ic_launcher.png"
                cp www/icons/icon-192.png "$d/ic_launcher_round.png"
                cp www/icons/icon-192.png "$d/ic_launcher_foreground.png"
                ;;
            esac
          done

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nomera.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nomera-apk
          path: nomera.apk
